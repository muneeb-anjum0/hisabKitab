name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  ledger-tests:
    name: App unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  security-rules:
    name: Firestore access rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  platform-tests:
    name: Dates, currency, and app configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- app/src/lib/currency.test.js app/src/lib/dates.test.js app/src/lib/platform.test.js

  web-build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deployable output
        run: test -f dist/index.html && ! test -f dist/sw.js

  android-build:
    name: Android APK build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:android
      - run: npx cap sync android
      - name: Compile APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --max-workers=2 > gradle-build.log 2>&1; then
              cat gradle-build.log
              exit 0
            fi
            cat gradle-build.log
            if ! grep -q 'Received status code 429' gradle-build.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Preserve APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: HisabKitab-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/HisabKitab-debug.apk
          if-no-files-found: error
          retention-days: 14
