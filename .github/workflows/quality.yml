name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-tests:
    name: Ledger and Money Lots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- src/lib/calculations.test.js

  platform-tests:
    name: Dates, currency, and app configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- src/lib/currency.test.js src/lib/dates.test.js src/lib/platform.test.js

  web-build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deployable output
        run: test -f dist/index.html && test -f dist/manifest.webmanifest && test -f dist/sw.js

  android-build:
    name: Android APK build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Preserve APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: HisabKitab-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/HisabKitab-debug.apk
          if-no-files-found: error
          retention-days: 14
